[project]
name = "payroll-backend"
version = "0.1.0"
description = "Attendance-driven payroll calculation API"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1,<4",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "python-calamine>=0.5,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

